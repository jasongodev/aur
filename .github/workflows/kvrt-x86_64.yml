name: Update AUR Package

on:
  #schedule:
  #  - cron: '0 * * * *' # Every hour
  workflow_dispatch:

jobs:
  update-aur:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: write
    env:
      TERM: xterm # Prevents errors when running programs under sudo/su

    steps:
      - name: Determine Package Name
        id: package
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # Extract package name from path (e.g., .github/workflows/my-pkg.yml@refs/heads/main -> my-pkg)
          NO_AT="${WORKFLOW_REF%%@*}" # .github/workflows/my-pkg.yml
          NO_PATH="${NO_AT##*/}" # my-pkg.yml
          PKG_NAME="${NO_PATH%.*}" # my-pkg
          
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "Target AUR Package Name: $PKG_NAME"

      - name: Install minimal dependencies
        run: |
          pacman -Syu --noconfirm devtools nvchecker

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream for updates
        id: package_status
        run: |
          cd "${{ steps.package.outputs.name }}"

          n=0
          until [ "$n" -ge 5 ]
          do
            STATUS=$(pkgctl version check --json)
            echo "$STATUS" | grep -q '"status": "success"' && break
            n=$((n+1))
            echo "pkgctl version check failed. Retrying ($n/5)..."
            sleep 10
          done
          echo $STATUS
          if echo "$STATUS" | grep -q '"out_of_date": true'; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
            echo "Package is outdated."
          else
            echo "outdated=false" >> "$GITHUB_OUTPUT"
            echo "Package is latest."
          fi

      - name: Install build dependencies
        if: steps.package_status.outputs.outdated == 'true'
        run: |
          pacman -Syu --noconfirm git gnupg openssh

      - name: Setup Build User
        if: steps.package_status.outputs.outdated == 'true'
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure SSH Keys
        if: steps.package_status.outputs.outdated == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p /root/.ssh

          echo "$AUR_SSH_PRIVATE_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          
          ssh-keyscan -t rsa,ed25519 aur.archlinux.org >> /root/.ssh/known_hosts 2>/dev/null
          
          cat << 'EOF' > /root/.ssh/config
          Host aur.archlinux.org
            IdentityFile /root/.ssh/aur
            User aur
          EOF
          chmod 600 /root/.ssh/config

      - name: Run version upgrade
        if: steps.package_status.outputs.outdated == 'true'
        run: |
          cd "${{ steps.package.outputs.name }}"
          chown -R builder:builder .
          
          # Run package updates as builder user with up to 5 retries
          n=0
          until [ "$n" -ge 5 ]
          do
            sudo -u builder pkgctl version upgrade >/dev/null && break
            n=$((n+1))
            echo "pkgctl version upgrade failed. Retrying ($n/5)..."
            sleep 10
          done

          if [ $n -eq 5 ]; then
            echo "pkgctl version upgrade failed after 5 attempts."
            exit 1
          fi

          sudo -u builder makepkg --printsrcinfo > .SRCINFO

      - name: Configure GPG Key & Git Identity
        if: steps.package_status.outputs.outdated == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --no-tty --yes --import

          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep -E 'sec' | head -n 1 | awk '{print $2}' | cut -d'/' -f2) 

          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"
          git config --global user.signingkey "$KEY_ID"
          git config --global commit.gpgsign true
          git config --global gpg.program gpg

      - name: Commit, Push to AUR & Sync to GitHub
        if: steps.package_status.outputs.outdated == 'true'
        run: |
          # Detect active branch name (master or main)
          BRANCH=$(git branch --show-current)
          
          # Parse resolved version from .SRCINFO
          PKGVER=$(grep -E '^\s*pkgver =' .SRCINFO | awk '{print $3}')
          PKGREL=$(grep -E '^\s*pkgrel =' .SRCINFO | awk '{print $3}')
          FULL_VER="${PKGVER}-${PKGREL}"

          git add PKGBUILD .SRCINFO
          git commit -m "chore(release): auto-upgrade to version $FULL_VER"
          git push --dry-run